name: boxcalm
description: A calm, offline box-breathing coach with haptics, voice and progress.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.0
  audioplayers: ^6.5.1
  vibration: ^3.1.4
  wakelock_plus: ^1.3.2
  fl_chart: ^0.69.2
  share_plus: ^10.1.4
  permission_handler: ^11.4.0
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_icon_512.png"
  adaptive_icon_background: "#07121F"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/icon_monochrome.png"
  min_sdk_android: 23
  remove_alpha_ios: true

flutter_native_splash:
  color: "#07121F"
  image: assets/images/splash_logo.png
  color_dark: "#07121F"
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#07121F"
    image: assets/images/splash_logo.png
    color_dark: "#07121F"
    image_dark: assets/images/splash_logo.png
    icon_background_color: "#07121F"
  web: false
  android: true
  ios: false
